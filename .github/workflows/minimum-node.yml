name: Minimum Node

# The server provider declares the oldest Node it supports in engines.node. The CI build runs on the
# current Node, so this tests the declared minimum too, and must be a required check on PRs to main.
# It reads the minimum from engines.node, so the two can't drift apart.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: minimum-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-minimum-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      # setup-node can read engines.node itself, but it resolves a range like >=22 to the newest Node that
      # satisfies it, which would test the current Node again. Take the lower bound instead.
      - name: Read the minimum from engines.node
        id: minimum
        run: |
          node -e '
            const declared = require("./packages/server/package.json").engines.node;
            const match = /^>=\s*(\d+(\.\d+){0,2})$/.exec(declared.trim());
            if (!match) {
              console.error(`packages/server declares engines.node "${declared}". This workflow only understands ">=<version>", so update it to test the right minimum.`);
              process.exit(1);
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\n`);
          '

      - name: Test on Node ${{ steps.minimum.outputs.version }}
        uses: ./.github/actions/test
        with:
          node-version: ${{ steps.minimum.outputs.version }}
