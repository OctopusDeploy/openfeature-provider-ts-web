name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run per branch/PR; cancel superseded runs so pushes get fast feedback.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
