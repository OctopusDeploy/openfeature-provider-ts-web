name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run per branch/PR; cancel superseded runs so pushes get fast feedback.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
