name: CI build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"
      timezone: "Australia/Brisbane"

  workflow_dispatch:

env:
  OCTOPUS_SPACE: "Developer Experience"

jobs:
  # The build below tests against the SDK version in devDependencies. This job tests against the
  # lowest version our peerDependencies range promises, so a change that needs a newer SDK fails here
  # instead of breaking apps that are still on an older one.
  test-lowest-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install lowest supported OpenFeature SDK
        run: |
          lowest() { node -p "process.argv[1].trim().replace(/^[\\^~]/, '')" "$1"; }
          SDK=$(lowest "$(node -p "require('./package.json').peerDependencies['@openfeature/web-sdk']")")
          # Older SDK releases pin an exact version of core, so take core from the SDK's own peer range.
          CORE=$(lowest "$(npm view "@openfeature/web-sdk@$SDK" peerDependencies.@openfeature/core)")
          echo "Installing @openfeature/web-sdk@$SDK and @openfeature/core@$CORE"
          npm install --no-save --no-audit --no-fund "@openfeature/web-sdk@$SDK" "@openfeature/core@$CORE"
          # Fail if npm resolved something else, otherwise this job would quietly test the wrong versions.
          for pkg in "web-sdk:$SDK" "core:$CORE"; do
            name=${pkg%%:*}; want=${pkg#*:}
            got=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@openfeature/$name/package.json')).version")
            [ "$got" = "$want" ] || { echo "Expected @openfeature/$name@$want, got $got"; exit 1; }
          done

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  test-build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required to obtain the ID token from GitHub Actions
      contents: read
      checks: write # Required to publish the test report

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Build, Test, Pack, and Deploy (CI)
        uses: ./.github/actions/build-test-pack-deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          prerelease-tag: "ci"
          octopus-url: ${{ secrets.OCTOPUS_URL }}

      - name: Prepare PR version suffix
        if: github.event_name == 'pull_request'
        id: pr-version
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          # Sanitize: replace special chars with hyphens, convert to lowercase
          SANITIZED=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//')
          # Truncate to 20 characters
          TRUNCATED=${SANITIZED:0:20}
          # Remove trailing hyphens after truncation
          TRUNCATED=$(echo "$TRUNCATED" | sed 's/-*$//')
          echo "branch-name=$TRUNCATED" >> $GITHUB_OUTPUT

      - name: Build, Test, Pack, and Deploy (PR)
        uses: ./.github/actions/build-test-pack-deploy
        if: github.event_name == 'pull_request'
        with:
          prerelease-tag: pr.${{ github.event.pull_request.number }}.${{ steps.pr-version.outputs.branch-name }}
          octopus-url: ${{ secrets.OCTOPUS_URL }}
