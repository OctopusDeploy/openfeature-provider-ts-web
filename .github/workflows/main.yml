name: CI build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"
      timezone: "Australia/Brisbane"

  workflow_dispatch:

env:
  OCTOPUS_SPACE: "Developer Experience"

jobs:
  # The build below tests against the SDK version in devDependencies. This job tests against the
  # lowest version our peerDependencies range promises, so a change that needs a newer SDK fails here
  # instead of breaking apps that are still on an older one. The @openfeature/core peer range, in
  # core and in each provider, must reach down to the version those SDKs require.
  # Both providers share one copy of @openfeature/core in the workspace, so both lowest SDKs must
  # accept the same core version. They do today; if that changes, the install below fails.
  test-lowest-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install lowest supported OpenFeature SDKs
        run: |
          lowest() { node -p "process.argv[1].trim().replace(/^[\\^~]/, '')" "$1"; }
          WEB_SDK=$(lowest "$(node -p "require('./packages/web/package.json').peerDependencies['@openfeature/web-sdk']")")
          SERVER_SDK=$(lowest "$(node -p "require('./packages/server/package.json').peerDependencies['@openfeature/server-sdk']")")
          # Older SDK releases pin an exact version of core, so take core from the SDKs' own peer ranges.
          CORE=$(lowest "$(npm view "@openfeature/web-sdk@$WEB_SDK" peerDependencies.@openfeature/core)")
          SERVER_CORE=$(lowest "$(npm view "@openfeature/server-sdk@$SERVER_SDK" peerDependencies.@openfeature/core)")
          [ "$CORE" = "$SERVER_CORE" ] || { echo "@openfeature/web-sdk@$WEB_SDK needs @openfeature/core@$CORE, but @openfeature/server-sdk@$SERVER_SDK needs $SERVER_CORE"; exit 1; }
          echo "Installing @openfeature/web-sdk@$WEB_SDK, @openfeature/server-sdk@$SERVER_SDK and @openfeature/core@$CORE"
          # Web, core and the SDK must all load the same copy of @openfeature/core, as they do in an app,
          # or core's errors aren't instances of the SDK's classes. Point the workspaces' devDependencies
          # at the lowest versions and drop the lockfile's placement of these packages, so npm places
          # them afresh and hoists one shared copy. Left in the lockfile, npm nests a copy per workspace.
          npm pkg set -w packages/web "devDependencies.@openfeature/web-sdk=$WEB_SDK"
          npm pkg set -w packages/server "devDependencies.@openfeature/server-sdk=$SERVER_SDK"
          npm pkg set -w packages/core "devDependencies.@openfeature/core=$CORE"
          node -e "
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('package-lock.json'));
            for (const key of Object.keys(lock.packages)) if (key.includes('node_modules/@openfeature/')) delete lock.packages[key];
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 4));
          "
          npm install --no-audit --no-fund
          # Fail if npm resolved something else, otherwise this job would quietly test the wrong versions.
          for pkg in "web-sdk:$WEB_SDK" "server-sdk:$SERVER_SDK" "core:$CORE"; do
            name=${pkg%%:*}; want=${pkg#*:}
            got=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@openfeature/$name/package.json')).version")
            [ "$got" = "$want" ] || { echo "Expected @openfeature/$name@$want, got $got"; exit 1; }
          done
          nested=$(find packages specification-tests api-surface -path "*/node_modules/@openfeature/*" -prune -print)
          [ -z "$nested" ] || { echo "Expected one shared copy of each OpenFeature package, also found: $nested"; exit 1; }

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  test-build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required to obtain the ID token from GitHub Actions
      contents: read
      checks: write # Required to publish the test report

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Build, Test, Pack, and Deploy (CI)
        uses: ./.github/actions/build-test-pack-deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          prerelease-tag: "ci"
          octopus-url: ${{ secrets.OCTOPUS_URL }}

      - name: Prepare PR version suffix
        if: github.event_name == 'pull_request'
        id: pr-version
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          # Sanitize: replace special chars with hyphens, convert to lowercase
          SANITIZED=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-*//' | sed 's/-*$//')
          # Truncate to 20 characters
          TRUNCATED=${SANITIZED:0:20}
          # Remove trailing hyphens after truncation
          TRUNCATED=$(echo "$TRUNCATED" | sed 's/-*$//')
          echo "branch-name=$TRUNCATED" >> $GITHUB_OUTPUT

      - name: Build, Test, Pack, and Deploy (PR)
        uses: ./.github/actions/build-test-pack-deploy
        if: github.event_name == 'pull_request'
        with:
          prerelease-tag: pr.${{ github.event.pull_request.number }}.${{ steps.pr-version.outputs.branch-name }}
          octopus-url: ${{ secrets.OCTOPUS_URL }}
